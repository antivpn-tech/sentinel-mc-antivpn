name: Release Universal Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Universal Shaded JAR with Maven
        run: |
          if [ -d "$HOME/.m2/repository" ]; then
            find "$HOME/.m2/repository" \( -name "_remote.repositories" -o -name "resolver-status.properties" -o -name "*.lastUpdated" \) -delete 2>/dev/null || true
          fi
          mvn -B clean package --no-transfer-progress -Dmaven.wagon.http.retryHandler.count=3 || {
            echo "Retrying Maven build after purging snapshot metadata..."
            rm -rf "$HOME/.m2/repository/io/papermc" "$HOME/.m2/repository/com/velocitypowered" "$HOME/.m2/repository/net/md-5"
            find "$HOME/.m2/repository" \( -name "_remote.repositories" -o -name "resolver-status.properties" -o -name "*.lastUpdated" \) -delete 2>/dev/null || true
            mvn -B clean package -U --no-transfer-progress
          }

      - name: Locate Compiled Release Artifact
        id: locate_jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name "Sentinel-Minecraft-*.jar" ! -name "original-*" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            JAR_PATH=$(find target -name "Sentinel-Minecraft-*.jar" ! -name "original-*" | head -n 1)
          fi
          echo "Found release binary: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Clean Previous Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning previous GitHub releases..."
          for id in $(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r '.[].id'); do
            echo "Deleting old release ID: $id"
            curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$id"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.3' }}
          files: ${{ steps.locate_jar.outputs.jar_path }}
          name: "Sentinel Minecraft ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.3' }}"
          generate_release_notes: false
          body: |
            ## Sentinel Minecraft Connector ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.3' }}

            Official universal Kotlin plugin connecting Minecraft networks to the Sentinel Edge Intelligence Network ([antivpn.tech](https://antivpn.tech)).

            ### Supported Platforms
            - Velocity 3.3+
            - BungeeCord / Waterfall
            - Paper / Purpur / Folia / Spigot / Bukkit 1.8 – 1.21+

            ### Key Capabilities
            - **Active Blocking by Default**: Mode defaults to `ENFORCE` upon installation.
            - **Gaming Optimizer & WARP Bypass**: Preserves Cloudflare WARP, ExitLag, WTFast, NoPing, Mudfish, GearUP, and ping routing software.
            - **Zero-Spam Console Wave Summaries**: Swallows per-IP connection/disconnect flood spam (including native server login handler chatter) into structured 5-second wave digests, with on/off toggle (`/sentinel logs <on|off>`).
            - **Fail-Open Architecture**: Sub-5ms async queries; players are never disconnected during network drops.
            - **Rate-Limited Discord Telemetry**: Consolidated alert digest during high-volume bot raids.
            - **Zero Dependencies**: Kotlin standard library is fully shaded and isolated.

            ### Installation
            1. Download the `Sentinel-Minecraft-*.jar` release binary below.
            2. Place into your server or proxy `/plugins/` directory.
            3. Claim your license key at [antivpn.tech](https://antivpn.tech) and add it to `config.yml`.
            4. Execute `/sentinel reload`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
